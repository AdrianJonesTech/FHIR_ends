services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fhir_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fhir_db
      BLUEBUTTON_CLIENT_ID: ${BLUEBUTTON_CLIENT_ID}
      BLUEBUTTON_CLIENT_SECRET: ${BLUEBUTTON_CLIENT_SECRET}
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - .git/
        - action: sync+restart
          path: pyproject.toml
          target: /app/pyproject.toml

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - ./frontend/node_modules/
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data:
